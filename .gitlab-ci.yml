# GitLab CI/CD Pipeline for Fight the Machine
# Builds Docker image, QEMU VM, Win32 clients (Docker and QEMU), and Native Windows port

stages:
  - build
  - test
  - package
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  WIN32_ARTIFACT_NAME: fightthemachine-win32
  QEMU_VERSION: "8.2.0"
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_DEPTH: "50"

# =============================================================================
# Docker Image Build (Linux runner with Docker - uses host Docker, not dind)
# =============================================================================

build:docker:
  stage: build
  tags:
    - linux
    - debian
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    # Point Docker storage to /mnt/scratch (900GB) - don't copy, just recreate
    - |
      if [ ! -L /var/lib/docker ] && [ -d /mnt/scratch ]; then
        echo "Pointing Docker storage to /mnt/scratch..."
        sudo systemctl stop docker.socket docker || true
        sudo rm -rf /var/lib/docker
        sudo mkdir -p /mnt/scratch/docker
        sudo ln -s /mnt/scratch/docker /var/lib/docker
        sudo systemctl start docker.socket docker || true
      fi
    - sudo mkdir -p /mnt/scratch/buildx && sudo rm -rf /root/.docker/buildx && sudo ln -sf /mnt/scratch/buildx /root/.docker/buildx || true
    # Clean up old caches
    - sudo docker system prune -af --volumes || true
    - sudo docker builder prune -af || true
    # Login to registries
    - sudo docker login -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN || true
    - sudo docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - sudo docker build --no-cache -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest . || docker build --no-cache -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - sudo docker push $DOCKER_IMAGE:$DOCKER_TAG || docker push $DOCKER_IMAGE:$DOCKER_TAG
    - sudo docker push $DOCKER_IMAGE:latest || docker push $DOCKER_IMAGE:latest
  after_script:
    # Clean up after build (including BuildKit cache)
    - sudo docker builder prune -af || docker builder prune -af || true
    - sudo docker system prune -af || docker system prune -af || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# QEMU VM Image Build (Linux runner with Docker and QEMU tools)
# =============================================================================

build:qemu-vm:
  stage: build
  tags:
    - linux
    - debian
  # NO DOCKER REQUIRED - uses Alpine minirootfs + chroot
  before_script:
    # Install qemu-img and e2fsprogs for disk image creation
    - sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs curl || true
    - which qemu-img || (echo "qemu-img not found" && exit 1)
  script:
    - cd qemu
    - chmod +x build-vm-image.sh
    # Script requires root for chroot - runs with sudo internally
    - ./build-vm-image.sh
  artifacts:
    name: "qemu-vm-$CI_COMMIT_SHORT_SHA"
    paths:
      - qemu/fightthemachine.qcow2
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Win32 Native Client Build - Docker Mode (Windows runner)
# =============================================================================

build:win32:
  stage: build
  tags:
    - windows
    - shell
  variables:
    CMAKE_BUILD_TYPE: Release
  cache:
    key: win32-${CI_COMMIT_REF_SLUG}
    paths:
      - win32/build/_deps/
  before_script:
    # Find and add CMake to PATH
    - |
      $cmakePaths = @(
        "C:\Program Files\CMake\bin",
        "C:\Program Files (x86)\CMake\bin",
        "${env:ProgramFiles}\CMake\bin",
        "${env:ProgramFiles(x86)}\CMake\bin"
      )
      foreach ($p in $cmakePaths) {
        if (Test-Path "$p\cmake.exe") {
          $env:PATH = "$p;$env:PATH"
          Write-Host "Found CMake at: $p"
          break
        }
      }
    # Try to load Visual Studio environment
    - |
      try {
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
        if ($vsPath) {
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"
          Write-Host "Visual Studio environment loaded from: $vsPath"
        }
      } catch {
        Write-Host "Visual Studio DevShell not loaded, continuing anyway..."
      }
    # Verify cmake is available
    - cmake --version
  script:
    - Set-Location "$env:CI_PROJECT_DIR\win32"
    - |
      if (-not (Test-Path build)) {
        New-Item -ItemType Directory -Path build | Out-Null
      }
    - Set-Location build
    - cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$env:CMAKE_BUILD_TYPE" -DUSE_DOCKER=ON -DUSE_QEMU=OFF ..
    - cmake --build . --config "$env:CMAKE_BUILD_TYPE" --parallel
    - cpack -C "$env:CMAKE_BUILD_TYPE" -G ZIP
  artifacts:
    name: "$WIN32_ARTIFACT_NAME-docker-$CI_COMMIT_SHORT_SHA"
    paths:
      - win32/build/Release/fightthemachine.exe
      - win32/build/Release/WebView2Loader.dll
      - win32/build/*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Win32 Native Client Build - QEMU Mode (Windows runner)
# =============================================================================

build:win32-qemu:
  stage: build
  tags:
    - windows
    - shell
  needs:
    - job: build:qemu-vm
      artifacts: true
  variables:
    CMAKE_BUILD_TYPE: Release
  cache:
    key: win32-qemu-${CI_COMMIT_REF_SLUG}
    paths:
      - win32/build-qemu/_deps/
  before_script:
    # Find and add CMake to PATH
    - |
      $cmakePaths = @(
        "C:\Program Files\CMake\bin",
        "C:\Program Files (x86)\CMake\bin",
        "${env:ProgramFiles}\CMake\bin",
        "${env:ProgramFiles(x86)}\CMake\bin"
      )
      foreach ($p in $cmakePaths) {
        if (Test-Path "$p\cmake.exe") {
          $env:PATH = "$p;$env:PATH"
          Write-Host "Found CMake at: $p"
          break
        }
      }
    # Try to load Visual Studio environment
    - |
      try {
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
        if ($vsPath) {
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"
          Write-Host "Visual Studio environment loaded from: $vsPath"
        }
      } catch {
        Write-Host "Visual Studio DevShell not loaded, continuing anyway..."
      }
    - cmake --version
    # Download QEMU for Windows
    - |
      $qemuUrl = "https://qemu.weilnetz.de/w64/qemu-w64-setup-$env:QEMU_VERSION.exe"
      $qemuInstaller = "$env:TEMP\qemu-setup.exe"
      if (-not (Test-Path $qemuInstaller)) {
        Write-Host "Downloading QEMU $env:QEMU_VERSION..."
        Invoke-WebRequest -Uri $qemuUrl -OutFile $qemuInstaller -UseBasicParsing
      }
      # Extract QEMU (use 7-zip if available)
      $qemuDir = "$env:CI_PROJECT_DIR\qemu\qemu-win64"
      if (-not (Test-Path $qemuDir)) {
        New-Item -ItemType Directory -Path $qemuDir -Force | Out-Null
      }
      $7zipPath = "C:\Program Files\7-Zip\7z.exe"
      if (Test-Path $7zipPath) {
        & $7zipPath x $qemuInstaller -o"$qemuDir" -y | Out-Null
      } else {
        Write-Host "7-Zip not found, trying silent install..."
        Start-Process -FilePath $qemuInstaller -ArgumentList "/S", "/D=$qemuDir" -Wait -NoNewWindow
      }
  script:
    - Set-Location "$env:CI_PROJECT_DIR\win32"
    - |
      if (-not (Test-Path build-qemu)) {
        New-Item -ItemType Directory -Path build-qemu | Out-Null
      }
    - Set-Location build-qemu
    - cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$env:CMAKE_BUILD_TYPE" -DUSE_QEMU=ON -DUSE_DOCKER=OFF ..
    - cmake --build . --config "$env:CMAKE_BUILD_TYPE" --parallel
    # Package with QEMU and VM
    - |
      $packageDir = "$env:CI_PROJECT_DIR\dist\FightTheMachine-QEMU"
      New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
      New-Item -ItemType Directory -Path "$packageDir\qemu" -Force | Out-Null
      New-Item -ItemType Directory -Path "$packageDir\vm" -Force | Out-Null
      # Copy launcher
      Copy-Item "Release\fightthemachine.exe" $packageDir
      Copy-Item "Release\WebView2Loader.dll" $packageDir -ErrorAction SilentlyContinue
      # Copy QEMU binaries
      $qemuBinDir = "$env:CI_PROJECT_DIR\qemu\qemu-win64"
      Get-ChildItem -Path $qemuBinDir -Filter "qemu-system-x86_64*.exe" | Copy-Item -Destination "$packageDir\qemu"
      Get-ChildItem -Path $qemuBinDir -Filter "*.dll" | Copy-Item -Destination "$packageDir\qemu"
      # Copy VM image
      Copy-Item "$env:CI_PROJECT_DIR\qemu\fightthemachine.qcow2" "$packageDir\vm\"
      # Create ZIP
      $zipPath = "$env:CI_PROJECT_DIR\dist\FightTheMachine-QEMU-$env:CI_COMMIT_SHORT_SHA.zip"
      Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
  artifacts:
    name: "$WIN32_ARTIFACT_NAME-qemu-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/FightTheMachine-QEMU-*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Native Windows Port Build - Process Library (Windows runner with MSYS2)
# =============================================================================

build:win32-native-lib:
  stage: build
  tags:
    - windows
    - shell
  variables:
    CMAKE_BUILD_TYPE: Release
    MSYSTEM: MINGW64
  cache:
    key: win32-native-lib-${CI_COMMIT_REF_SLUG}
    paths:
      - native/build/
  before_script:
    # Check for MSYS2
    - |
      $msys2Paths = @(
        "C:\msys64",
        "C:\tools\msys64",
        "$env:USERPROFILE\msys64"
      )
      $msys2 = $null
      foreach ($p in $msys2Paths) {
        if (Test-Path "$p\usr\bin\bash.exe") {
          $msys2 = $p
          Write-Host "Found MSYS2 at: $p"
          break
        }
      }
      if (-not $msys2) {
        Write-Host "MSYS2 not found, skipping native build"
        exit 0
      }
      $env:MSYS2_PATH = $msys2
  script:
    - |
      if ($env:MSYS2_PATH) {
        $env:MSYSTEM = "MINGW64"
        $env:CHERE_INVOKING = "1"
        $bash = "$env:MSYS2_PATH\usr\bin\bash.exe"
        $projectPath = ($env:CI_PROJECT_DIR -replace '\\','/') -replace '^([A-Za-z]):','/$1'.ToLower()
        # Install required MSYS2 packages - use --overwrite for existing files
        & $bash --login -c "pacman -S --noconfirm --needed --overwrite '*' mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc make"
        # Build process library using MINGW64 environment
        & $bash --login -c "export MSYSTEM=MINGW64 && source /etc/profile && cd $projectPath/native && ./build-msys2.sh"
      }
  artifacts:
    name: "fightthemachine-native-lib-$CI_COMMIT_SHORT_SHA"
    paths:
      - native/build/*.exe
      - native/build/*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # MSYS2 may not be installed on all runners

# =============================================================================
# Native Windows Port Build - Full psDoom-ng (Windows runner with MSYS2)
# Builds native Windows Fight the Machine that kills REAL Windows processes
# =============================================================================

build:windows-native:
  stage: build
  tags:
    - windows
    - shell
  variables:
    CMAKE_BUILD_TYPE: Release
    MSYSTEM: MINGW64
  cache:
    key: windows-native-${CI_COMMIT_REF_SLUG}
    paths:
      - native/windows/build/
      - psdoom-ng-src/
  before_script:
    # Check for MSYS2
    - |
      $msys2Paths = @(
        "C:\msys64",
        "C:\tools\msys64",
        "$env:USERPROFILE\msys64"
      )
      $msys2 = $null
      foreach ($p in $msys2Paths) {
        if (Test-Path "$p\usr\bin\bash.exe") {
          $msys2 = $p
          Write-Host "Found MSYS2 at: $p"
          break
        }
      }
      if (-not $msys2) {
        Write-Host "MSYS2 not found, skipping native Windows build"
        exit 0
      }
      $env:MSYS2_PATH = $msys2
  script:
    - |
      if ($env:MSYS2_PATH) {
        $env:MSYSTEM = "MINGW64"
        $env:CHERE_INVOKING = "1"
        $bash = "$env:MSYS2_PATH\usr\bin\bash.exe"
        $projectPath = ($env:CI_PROJECT_DIR -replace '\\','/') -replace '^([A-Za-z]):','/$1'.ToLower()
        # Install required MSYS2 packages including SDL
        & $bash --login -c "pacman -S --noconfirm --needed --overwrite '*' mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-SDL mingw-w64-x86_64-SDL_mixer mingw-w64-x86_64-SDL_net mingw-w64-x86_64-libpng git make"
        # Build native psDoom-ng using MINGW64 environment
        & $bash --login -c "export MSYSTEM=MINGW64 && source /etc/profile && cd $projectPath/native/windows && chmod +x build-windows.sh && ./build-windows.sh --clean"
      }
    # Package the build
    - |
      if (Test-Path "native\windows\build\fightthemachine.exe") {
        $packageDir = "dist\FightTheMachine-Native"
        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

        # Copy main executable
        Copy-Item "native\windows\build\fightthemachine.exe" $packageDir

        # Copy SDL DLLs from MSYS2
        $mingwBin = "$env:MSYS2_PATH\mingw64\bin"
        Copy-Item "$mingwBin\SDL.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\SDL_mixer.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\libSDL_mixer-1-2-0.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\SDL_net.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\libpng16-16.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\zlib1.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\libgcc_s_seh-1.dll" $packageDir -ErrorAction SilentlyContinue
        Copy-Item "$mingwBin\libwinpthread-1.dll" $packageDir -ErrorAction SilentlyContinue

        # Download shareware DOOM1.WAD
        Write-Host "Downloading DOOM1.WAD shareware..."
        Invoke-WebRequest -Uri "https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad" -OutFile "$packageDir\DOOM1.WAD"

        # Copy game WADs
        Copy-Item "wad\*.wad" $packageDir -ErrorAction SilentlyContinue

        # Copy config file and launcher
        Copy-Item "native\windows\fightthemachine.cfg" $packageDir
        Copy-Item "native\windows\run.bat" $packageDir
        Copy-Item "native\windows\README.md" "$packageDir\README.md"

        # Create ZIP
        $zipPath = "dist\FightTheMachine-Native-$env:CI_COMMIT_SHORT_SHA.zip"
        Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
        Write-Host "Created package: $zipPath"
        Get-ChildItem $packageDir
      } else {
        Write-Host "fightthemachine.exe not found, build may have failed"
      }
  artifacts:
    name: "fightthemachine-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - native/windows/build/fightthemachine.exe
      - dist/FightTheMachine-Native-*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true  # MSYS2 and SDL may not be installed on all runners

# =============================================================================
# Tests (Linux runner with Docker - uses host Docker)
# =============================================================================

test:docker:
  stage: test
  tags:
    - linux
    - debian
  # Use shell executor with host Docker daemon
  before_script:
    - sudo docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Start the container (use --privileged if needed for sysctl access)
    - sudo docker run -d --name test-ftm-$CI_JOB_ID -p 6080:6080 --security-opt seccomp=unconfined $DOCKER_IMAGE:$DOCKER_TAG || docker run -d --name test-ftm-$CI_JOB_ID -p 6080:6080 --security-opt seccomp=unconfined $DOCKER_IMAGE:$DOCKER_TAG
    # Wait for health check
    - |
      for i in $(seq 1 60); do
        status=$(sudo docker inspect --format='{{.State.Health.Status}}' test-ftm-$CI_JOB_ID 2>/dev/null || docker inspect --format='{{.State.Health.Status}}' test-ftm-$CI_JOB_ID 2>/dev/null)
        if echo "$status" | grep -q healthy; then
          echo "Container is healthy"
          break
        fi
        echo "Waiting for container to be healthy... ($i/60)"
        sleep 5
      done
    # Check noVNC is responding
    - curl -f http://localhost:6080/ || exit 1
    - echo "noVNC is responding correctly"
  after_script:
    - sudo docker stop test-ftm-$CI_JOB_ID || docker stop test-ftm-$CI_JOB_ID || true
    - sudo docker rm test-ftm-$CI_JOB_ID || docker rm test-ftm-$CI_JOB_ID || true
  needs:
    - build:docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true  # Runner may have Docker restrictions

# =============================================================================
# Package Release (Linux runner)
# =============================================================================

package:release:
  stage: package
  tags:
    - linux
    - debian
  script:
    - echo "Creating release package..."
    - mkdir -p release
    - |
      cat > release/README.txt << 'EOF'
      Fight the Machine - Release Package
      ====================================

      This package contains multiple versions of Fight the Machine:

      1. Docker Version (fightthemachine-docker.zip)
         - Requires Docker Desktop
         - Runs in a container

      2. QEMU Version (FightTheMachine-QEMU-*.zip)
         - Portable, no Docker required
         - Includes bundled VM (~150MB)
         - Best with Hyper-V/WHPX enabled

      3. Native Version (fightthemachine-native.zip)
         - Kills REAL Windows processes
         - Use with caution!
         - Run process-respawner.exe first

      Requirements:
        - Windows 10 or later (64-bit)
        - Microsoft Edge WebView2 Runtime

      Controls:
        - Arrow keys: Move
        - Ctrl: Fire
        - Space: Open doors
        - F11: Toggle fullscreen
        - ESC: Exit fullscreen

      Source: https://github.com/sp00nznet/fightthemachine
      EOF
    # Copy artifacts from previous jobs
    - cp win32/build/Release/fightthemachine.exe release/ || true
    - cp win32/build/Release/WebView2Loader.dll release/ || true
    - cp dist/FightTheMachine-QEMU-*.zip release/ || true
    - cp native/build/*.zip release/ || true
    - cp dist/FightTheMachine-Native-*.zip release/ || true
  artifacts:
    name: "fightthemachine-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/
    expire_in: 90 days
  needs:
    - build:win32
    - job: build:win32-qemu
      optional: true
    - job: build:win32-native-lib
      optional: true
    - job: build:windows-native
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Deploy Win32 Client to Network Share
# =============================================================================

deploy:win32:
  stage: deploy
  tags:
    - windows
    - shell
  needs:
    - job: build:win32
      artifacts: true
    - job: build:win32-qemu
      artifacts: true
      optional: true
  script:
    - 'net use R: \\192.168.100.22\releases gitlab /user:root'
    - '$destPath = "R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME"'
    - 'if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }'
    - 'Copy-Item -Path "win32\build\Release\fightthemachine.exe" -Destination $destPath -Force'
    - 'Copy-Item -Path "win32\build\Release\WebView2Loader.dll" -Destination $destPath -Force'
    - 'Copy-Item -Path "win32\build\*.zip" -Destination $destPath -Force -ErrorAction SilentlyContinue'
    - 'Copy-Item -Path "dist\FightTheMachine-QEMU-*.zip" -Destination $destPath -Force -ErrorAction SilentlyContinue'
    - 'Copy-Item -Path "LICENSE" -Destination $destPath -Force -ErrorAction SilentlyContinue'
    - 'net use R: /delete'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Deploy to Docker Hub (Linux runner - uses host Docker)
# =============================================================================

deploy:docker-hub:
  stage: deploy
  tags:
    - linux
    - debian
  # Use shell executor with host Docker daemon
  before_script:
    - sudo docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - sudo docker login -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN || docker login -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN
  script:
    - sudo docker pull $DOCKER_IMAGE:$DOCKER_TAG || docker pull $DOCKER_IMAGE:$DOCKER_TAG
    - sudo docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:$DOCKER_TAG || docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:$DOCKER_TAG
    - sudo docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:latest || docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:latest
    - sudo docker push sp00nznet/fightthemachine:$DOCKER_TAG || docker push sp00nznet/fightthemachine:$DOCKER_TAG
    - sudo docker push sp00nznet/fightthemachine:latest || docker push sp00nznet/fightthemachine:latest
  needs:
    - test:docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

# =============================================================================
# GitHub Mirror Sync (Linux runner)
# =============================================================================

sync:github:
  stage: deploy
  tags:
    - linux
    - debian
  variables:
    GIT_STRATEGY: clone
  before_script:
    - git config --global user.email "ci@buildforever.cloud"
    - git config --global user.name "GitLab CI"
  script:
    - git remote add github https://${GITHUB_TOKEN}@github.com/sp00nznet/fightthemachine.git || true
    - git fetch --all
    - git push github HEAD:main --force
    - git push github --tags --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
