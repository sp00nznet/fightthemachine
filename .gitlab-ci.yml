# GitLab CI/CD Pipeline for Fight the Machine
# Builds Docker image and Win32 native client

stages:
  - build
  - test
  - package
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  WIN32_ARTIFACT_NAME: fightthemachine-win32

# =============================================================================
# Docker Image Build (Linux runner with Docker)
# =============================================================================

build:docker:
  stage: build
  tags:
    - linux
    - debian
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    # Clean up to free disk space
    - docker system prune -af --volumes || true
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Use BuildKit for better caching and smaller images
    - docker build --no-cache -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  after_script:
    # Clean up after build
    - docker system prune -af || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Win32 Native Client Build (Windows runner)
# =============================================================================

build:win32:
  stage: build
  tags:
    - windows
    - shell
  variables:
    CMAKE_BUILD_TYPE: Release
  cache:
    key: win32-${CI_COMMIT_REF_SLUG}
    paths:
      - win32/build/_deps/
  before_script:
    # Find and add CMake to PATH
    - |
      $cmakePaths = @(
        "C:\Program Files\CMake\bin",
        "C:\Program Files (x86)\CMake\bin",
        "${env:ProgramFiles}\CMake\bin",
        "${env:ProgramFiles(x86)}\CMake\bin"
      )
      foreach ($p in $cmakePaths) {
        if (Test-Path "$p\cmake.exe") {
          $env:PATH = "$p;$env:PATH"
          Write-Host "Found CMake at: $p"
          break
        }
      }
    # Try to load Visual Studio environment
    - |
      try {
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
        if ($vsPath) {
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"
          Write-Host "Visual Studio environment loaded from: $vsPath"
        }
      } catch {
        Write-Host "Visual Studio DevShell not loaded, continuing anyway..."
      }
    # Verify cmake is available
    - cmake --version
  script:
    - Set-Location "$env:CI_PROJECT_DIR\win32"
    - |
      if (-not (Test-Path build)) {
        New-Item -ItemType Directory -Path build | Out-Null
      }
    - Set-Location build
    - cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE="$env:CMAKE_BUILD_TYPE" ..
    - cmake --build . --config "$env:CMAKE_BUILD_TYPE" --parallel
    - cpack -C "$env:CMAKE_BUILD_TYPE" -G ZIP
  artifacts:
    name: "$WIN32_ARTIFACT_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - win32/build/Release/fightthemachine.exe
      - win32/build/Release/WebView2Loader.dll
      - win32/build/*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Tests (Linux runner with Docker)
# =============================================================================

test:docker:
  stage: test
  tags:
    - linux
    - debian
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Start the container (use --privileged if needed for sysctl access)
    - docker run -d --name test-ftm -p 6080:6080 --security-opt seccomp=unconfined $DOCKER_IMAGE:$DOCKER_TAG
    # Wait for health check
    - |
      for i in $(seq 1 60); do
        if docker inspect --format='{{.State.Health.Status}}' test-ftm 2>/dev/null | grep -q healthy; then
          echo "Container is healthy"
          break
        fi
        echo "Waiting for container to be healthy... ($i/60)"
        sleep 5
      done
    # Check noVNC is responding
    - apk add --no-cache curl
    - curl -f http://localhost:6080/ || exit 1
    - echo "noVNC is responding correctly"
  after_script:
    - docker stop test-ftm || true
    - docker rm test-ftm || true
  needs:
    - build:docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true  # Runner may have Docker restrictions

# =============================================================================
# Package Release (Linux runner)
# =============================================================================

package:release:
  stage: package
  tags:
    - linux
    - debian
  image: alpine:latest
  script:
    - echo "Creating release package..."
    - mkdir -p release
    - |
      cat > release/README.txt << 'EOF'
      Fight the Machine - Release Package
      ====================================

      Win32 Client:
        - fightthemachine.exe: Main application
        - WebView2Loader.dll: Required runtime library

      Requirements:
        - Windows 10 or later
        - Docker Desktop installed and running
        - Microsoft Edge WebView2 Runtime

      Usage:
        1. Ensure Docker Desktop is running
        2. Run fightthemachine.exe
        3. Wait for the game container to start
        4. Play DOOM and kill processes!

      Controls:
        - Arrow keys: Move
        - Ctrl: Fire
        - Space: Open doors
        - F11: Toggle fullscreen
        - ESC: Exit fullscreen

      Source: https://github.com/sp00nznet/fightthemachine
      EOF
    - cp win32/build/Release/fightthemachine.exe release/ || true
    - cp win32/build/Release/WebView2Loader.dll release/ || true
  artifacts:
    name: "fightthemachine-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/
    expire_in: 90 days
  needs:
    - build:win32
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Deploy to Docker Hub (Linux runner)
# =============================================================================

deploy:docker-hub:
  stage: deploy
  tags:
    - linux
    - debian
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker login -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN
  script:
    - docker pull $DOCKER_IMAGE:$DOCKER_TAG
    - docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:$DOCKER_TAG
    - docker tag $DOCKER_IMAGE:$DOCKER_TAG sp00nznet/fightthemachine:latest
    - docker push sp00nznet/fightthemachine:$DOCKER_TAG
    - docker push sp00nznet/fightthemachine:latest
  needs:
    - test:docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

# =============================================================================
# GitHub Mirror Sync (Linux runner)
# =============================================================================

sync:github:
  stage: deploy
  tags:
    - linux
    - debian
  image: alpine/git:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - git config --global user.email "ci@buildforever.cloud"
    - git config --global user.name "GitLab CI"
  script:
    - git remote add github https://${GITHUB_TOKEN}@github.com/sp00nznet/fightthemachine.git || true
    - git fetch --all
    - git push github HEAD:main --force
    - git push github --tags --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
