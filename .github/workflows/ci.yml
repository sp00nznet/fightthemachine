# Build, check and package the native Windows port on every push and PR.
# A v* tag also publishes a GitHub Release with the ZIP and the CHANGELOG
# section for that version. Release builds come from here, not a workstation.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # gh release create

jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # package.ps1 names the ZIP from `git describe --tags`

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-SDL_net mingw-w64-x86_64-libpng

      - name: WAD converter self-check
        run: python patches/portable-psdoom-wad.py --self-check

      - name: Shell syntax
        shell: msys2 {0}
        run: for f in native/windows/build-windows.sh patches/*.sh; do bash -n "$f"; done

      - name: Build
        shell: msys2 {0}
        run: bash native/windows/build-windows.sh

      - name: Package
        shell: powershell
        run: .\native\windows\package.ps1 -SkipBuild -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"

      - uses: actions/upload-artifact@v5
        with:
          name: FightTheMachine-Native
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # The body of "## [x.y.z] - date" up to the next "## [" heading.
          awk -v v="$ver" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $ver"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Fight the Machine $GITHUB_REF_NAME" --notes-file notes.md
