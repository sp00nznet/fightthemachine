# Fight the Machine - psDoom Configuration
# ==========================================
#
# Scale factor for the game window (2-6)
# 2 = 640x400, 3 = 960x600, 4 = 1280x800, 5 = 1600x1000, 6 = 1920x1200
SCALE=2

# Run in windowed mode (1=yes, 0=no/fullscreen)
WINDOWED=1

# Safe mode - only allow killing "safe" processes (1=enabled, 0=disabled)
# WARNING: Disabling safe mode allows killing ANY process!
SAFE_MODE=1
