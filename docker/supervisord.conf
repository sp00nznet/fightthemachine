[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_RESOLUTION)sx24
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err
user=root

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":0"
autostart=true
autorestart=true
priority=200
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err
user=doom

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -nopw -listen 0.0.0.0 -xkb -noshm -forever -shared -rfbport 5900
autostart=true
autorestart=true
priority=300
startsecs=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err
user=root

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
priority=400
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
user=root

[program:psdoom]
command=/bin/bash -c "sleep 5 && cd /usr/share/games/doom && /usr/local/bin/psdoom -4 -nopsmon"
environment=DISPLAY=":0",HOME="/home/doom",USER="doom"
autostart=true
autorestart=true
priority=500
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/psdoom.log
stderr_logfile=/var/log/supervisor/psdoom.err
user=doom

[program:process-respawner]
command=/usr/bin/python3 /usr/local/bin/process-respawner.py
autostart=true
autorestart=true
priority=600
startsecs=5
stdout_logfile=/var/log/supervisor/respawner.log
stderr_logfile=/var/log/supervisor/respawner.err
user=root
